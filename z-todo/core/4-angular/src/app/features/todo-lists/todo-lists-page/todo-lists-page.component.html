<h2>Todo lists</h2>

<app-create-todo-list-form (create)="onCreate($event)" />

@if (lists().length === 0) {
  <p>No lists yet.</p>
} @else {
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Completion</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (list of lists(); track list.id) {
        <tr>
          <td><a [routerLink]="['/lists', list.id]">{{ list.name }}</a></td>
          <td>{{ list.completionPercentage }}%</td>
          <td><button type="button" (click)="onDelete(list.id)">Delete</button></td>
        </tr>
      }
    </tbody>
  </table>
}
