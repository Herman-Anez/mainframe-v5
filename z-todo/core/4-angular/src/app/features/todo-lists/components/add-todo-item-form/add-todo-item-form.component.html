<form class="add-item-form" (ngSubmit)="submit()">
  <input type="text" name="title" placeholder="Item title" [(ngModel)]="title" required />
  <input type="text" name="description" placeholder="Description (optional)" [(ngModel)]="description" />
  <select name="priority" [(ngModel)]="priority">
    @for (p of priorities; track p) {
      <option [value]="p">{{ p }}</option>
    }
  </select>
  <button type="submit">Add item</button>
</form>
